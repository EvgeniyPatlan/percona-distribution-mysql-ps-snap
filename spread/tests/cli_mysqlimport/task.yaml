summary: Percona Server mysqlimport CLI tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-distribution-mysql-ps/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing mysqlimport"

  CMD="percona-distribution-mysql-ps.mysql -u root"
  CMD_IMPORT="percona-distribution-mysql-ps.mysqlimport -u root"
  IMPORT_FILE="/var/snap/percona-distribution-mysql-ps/common/test_table.csv"

  # allow file import
  echo "secure-file-priv = \"\"" | tee -a /var/snap/percona-distribution-mysql-ps/current/etc/mysqld.cnf
  snap restart percona-distribution-mysql-ps.mysqld

  until ${CMD} -e "SHOW DATABASES;" &>/dev/null; do
    echo "Waiting for mysql to be available..."
    sleep 1
  done

  echo -e "1,value1,55\n2,value2,4\n3,value3,10" | tee ${IMPORT_FILE}

  ${CMD} -e "CREATE DATABASE test_db;"
  ${CMD} -e "USE test_db; CREATE TABLE test_table (id INT PRIMARY KEY, name VARCHAR(50), value INT);"
  ${CMD_IMPORT} --columns=id,name,value --fields-terminated-by=',' test_db ${IMPORT_FILE}

  ${CMD} -e "DROP DATABASE test_db;"

restore: |
  snap remove percona-distribution-mysql-ps --purge --terminate
