summary: Percona Server snap smoke tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-distribution-mysql-ps/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Percona Server snap smoke tests"

  SNAP_VERSION=$(awk -F\' '/^version/{print $2}' "${SPREAD_PATH}"/snap/snapcraft.yaml)
  percona-distribution-mysql-ps.mysql --user=root --execute="select @@version;" -E | \
    grep "^@@version: ${SNAP_VERSION:-error}"

  echo "Ensure all tools are present"
  for tool in mysqldump mysqlimport mysqlshow mysqlslap mysqlcheck; do
    echo "Test ${tool}"
    percona-distribution-mysql-ps.${tool} --help &>/dev/null
  done

  echo "Test ps-admin"
  percona-distribution-mysql-ps.ps-admin --help >/dev/null

  echo "Distribution tool roll-call"
  percona-distribution-mysql-ps.xtrabackup --version
  percona-distribution-mysql-ps.mysqlsh --version
  percona-distribution-mysql-ps.mysqlrouter --version
  # orchestrator-client's upstream help formatter shells out to whoami/column,
  # which are unreliable under strict confinement (whoami exec denied by
  # apparmor; column absent from the core24 base) -- best-effort like its
  # neighbors below.
  percona-distribution-mysql-ps.orchestrator-client -c help >/dev/null 2>&1 || true
  percona-distribution-mysql-ps.proxysql-admin --help >/dev/null 2>&1 || true
  percona-distribution-mysql-ps.proxysql-status >/dev/null 2>&1 || true
  percona-distribution-mysql-ps.xbstream --help >/dev/null 2>&1 || true
  percona-distribution-mysql-ps.xbcloud --help >/dev/null 2>&1 || true
  percona-distribution-mysql-ps.xbcrypt --help >/dev/null 2>&1 || true

  echo "Ensure Percona Toolkit tools are present"
  percona-distribution-mysql-ps.pt-summary --help 2>&1 | grep -q "Usage:"
  percona-distribution-mysql-ps.pt-query-digest --version &>/dev/null

  echo "Ensure telemetry is not active"
  # variable must be absent (component not loaded) or ON (disabled); never OFF
  if percona-distribution-mysql-ps.mysql --user=root \
      --execute="SHOW VARIABLES LIKE 'percona_telemetry_disable';" | grep -iq OFF; then
    echo "Telemetry is enabled but must be disabled"
    exit 1
  fi
  test ! -e /snap/percona-distribution-mysql-ps/current/usr/bin/percona-telemetry-agent

  echo "Test TCP connection (exercises server-side NSS resolution)"
  # root@localhost is auth_socket-only (see the install hook), so a TCP login
  # must be denied, not silently accepted. Reaching mysqld and getting back a
  # clean authentication decision still proves TCP listening plus
  # server-side NSS resolution work end-to-end.
  TCP_OUTPUT=$(percona-distribution-mysql-ps.mysql -u root -h 127.0.0.1 --protocol=TCP --execute="SELECT 1;" 2>&1) || :
  echo "${TCP_OUTPUT}" | grep -q "ERROR 1698 (28000): Access denied for user 'root'@'localhost'"

  echo "Confirm root can still authenticate via the local socket (auth_socket)"
  percona-distribution-mysql-ps.mysql --user=root --execute="SELECT 1;" >/dev/null

  echo "Test mysqladmin"
  # mysqladmin returns 1 when called with `--help`, 127 if not found
  percona-distribution-mysql-ps.mysqladmin --help &>/dev/null || [ $? -eq 1 ] && exit 0 || exit 127

restore: |
  snap remove percona-distribution-mysql-ps --purge --terminate
