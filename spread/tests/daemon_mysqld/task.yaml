summary: Percona Server mysqld service tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-distribution-mysql-ps/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing service control"
  CMD="percona-distribution-mysql-ps.mysql -u root"

  echo "Stopping percona-distribution-mysql-ps.mysqld"
  snap stop percona-distribution-mysql-ps.mysqld
  until [ ! -e /var/snap/percona-distribution-mysql-ps/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock to be removed"
    sleep 1
  done

  ${CMD} -e "SELECT 1;" &>/dev/null || :
  snap services percona-distribution-mysql-ps.mysqld | grep -q inactive

  echo "Starting percona-distribution-mysql-ps.mysqld"
  snap start percona-distribution-mysql-ps.mysqld
  until [ -S /var/snap/percona-distribution-mysql-ps/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock to be created"
    sleep 1
  done

  ${CMD} -e "SELECT 1;" &>/dev/null
  snap services percona-distribution-mysql-ps.mysqld | grep -q " active"

restore: |
  snap remove percona-distribution-mysql-ps --purge --terminate
