summary: Percona Server mysqlcheck CLI tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-distribution-mysql-ps/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing mysqlcheck"

  CMD="percona-distribution-mysql-ps.mysqlcheck -u root"

  ${CMD} --silent --extended --all-databases

restore: |
  snap remove percona-distribution-mysql-ps --purge --terminate
