parts:
  packages-deb:
    plugin: nil
    stage-packages:
      - percona-server-server=9.7.1-1-1.resolute
      - percona-server-client=9.7.1-1-1.resolute
      - percona-server-rocksdb=9.7.1-1-1.resolute
      - percona-xtrabackup-97=9.7.1~rc1-1.resolute
      - percona-mysql-router=9.7.1-1-1.resolute
      - percona-mysql-shell=9.7.1-1-1.resolute
      - proxysql3=2:3.0.9-1.1.resolute
      - percona-orchestrator=2:3.2.6-23.resolute
      - percona-orchestrator-client=2:3.2.6-23.resolute
      - percona-toolkit=3.7.1-4.resolute
      - libdbd-mysql-perl=1:5.013-4.resolute
      - util-linux
      - perl
      - libdbi-perl
      - libterm-readkey-perl
      - libio-socket-ssl-perl
    prime:
      # Percona telemetry agent (pulled in as a hard dependency; not shipped)
      - -usr/bin/percona-telemetry-agent
      - -etc/default
      - -etc/logrotate.d
      - -usr/sbin/logrotate
      - -lib/systemd
      - -usr/lib/systemd
      # Host-only integration files that make no sense inside a snap
      - -etc/init.d
      - -etc/apparmor.d
      - -etc/cron.daily
      - -etc/logcheck
      - -etc/config.toml
      - -usr/bin/mysql-systemd
      # Test-only tools and debug binaries
      - -usr/bin/mysqltest
      - -usr/bin/mysql_client_test
      - -usr/bin/mysql_keyring_encryption_test
      - -usr/bin/xtrabackup-debug
      - -usr/sbin/mysqld-debug
      - -usr/lib/mysql/plugin/debug
      # rsync: pulled in only as apt-recommends noise (real build staged it
      # alongside a pile of unrelated -dev packages); no wrapper or
      # component in this snap invokes it, so it is dropped rather than
      # kept in sync with libpopt.so below (its only staged dependent).
      - -usr/bin/rsync
      - -usr/bin/rsync-ssl
      - -usr/share/doc/rsync
      - -usr/share/rsync
      - -usr/share/lintian/overrides/rsync
      # Orchestrator: unused samples and legacy resources
      - -usr/local/orchestrator/orchestrator-sample.conf.json
      - -usr/local/orchestrator/orchestrator-sample-sqlite.conf.json
      - -usr/local/orchestrator/resources/pseudo-gtid
      # Mute lint: unused libraries (sibling baseline; extended from real
      # build lint output)
      - -usr/lib/*/libBrokenLocale.so*
      - -usr/lib/*/libanl.so*
      - -usr/lib/*/libbrotlienc.so*
      - -usr/lib/*/libc_malloc_debug.so*
      - -usr/lib/*/libdl.so*
      - -usr/lib/*/libdrop_ambient.so*
      - -usr/lib/*/libexpatw.so*
      - -usr/lib/*/libformw.so*
      - -usr/lib/*/libgmpxx.so*
      - -usr/lib/*/libgnutls-dane.so*
      - -usr/lib/*/libgnutls-openssl.so*
      - -usr/lib/*/libhistory.so*
      - -usr/lib/*/libkadm5clnt_mit.so*
      - -usr/lib/*/libkadm5srv_mit.so*
      - -usr/lib/*/libkdb5.so*
      - -usr/lib/*/libmemusage.so*
      - -usr/lib/*/libmenuw.so*
      - -usr/lib/*/libmvec.so*
      - -usr/lib/*/libnsl.so*
      - -usr/lib/*/libnss_compat.so*
      - -usr/lib/*/libnss_dns.so*
      - -usr/lib/*/libnss_files.so*
      - -usr/lib/*/libnss_hesiod.so*
      - -usr/lib/*/libpamc.so*
      - -usr/lib/*/libpcprofile.so*
      - -usr/lib/*/libpopt.so*
      - -usr/lib/*/libpthread.so*
      - -usr/lib/*/librt.so*
      - -usr/lib/*/libthread_db.so*
      - -usr/lib/*/libtic.so*
      - -usr/lib/*/libunbound.so*
      - -usr/lib/*/libutil.so*
    organize:
      # proxysql3's packaged default config collides at the same stage path
      # (etc/proxysql.cnf) with the seeded config the snap-scripts part
      # installs there; reroute the packaged default out of the way so our
      # own config (rendered by the install hook) is the one that ships.
      # Confirmed via `dpkg-deb -c` on the pdps-97-lts proxysql3 .deb that
      # it still ships its default at ./etc/proxysql.cnf, same collision
      # as proxysql2 on the 8.4 track.
      etc/proxysql.cnf: usr/share/proxysql3/proxysql.cnf.default
      usr/share/doc/percona-server-server/copyright: licenses/COPYRIGHT-percona-server-server
      usr/share/doc/percona-server-client/copyright: licenses/COPYRIGHT-percona-server-client
      usr/share/doc/percona-server-common/copyright: licenses/COPYRIGHT-percona-server-common
      usr/share/doc/percona-server-rocksdb/copyright: licenses/COPYRIGHT-percona-server-rocksdb
      # 9.7 track: percona-server-server/-client now pull in split
      # -server-core/-client-core/-client-plugins packages (confirmed
      # present in the pdps-97-lts index; absent as separate copyright
      # files on 8.4, so not touched there).
      usr/share/doc/percona-server-server-core/copyright: licenses/COPYRIGHT-percona-server-server-core
      usr/share/doc/percona-server-client-core/copyright: licenses/COPYRIGHT-percona-server-client-core
      usr/share/doc/percona-server-client-plugins/copyright: licenses/COPYRIGHT-percona-server-client-plugins
      usr/share/doc/percona-xtrabackup-97/copyright: licenses/COPYRIGHT-percona-xtrabackup
      usr/share/doc/percona-mysql-router/copyright: licenses/COPYRIGHT-percona-mysql-router
      usr/share/doc/percona-mysql-shell/copyright: licenses/COPYRIGHT-percona-mysql-shell
      usr/share/doc/proxysql3/copyright: licenses/COPYRIGHT-proxysql
      usr/share/doc/percona-orchestrator/copyright: licenses/COPYRIGHT-percona-orchestrator
      usr/share/doc/percona-orchestrator-client/copyright: licenses/COPYRIGHT-percona-orchestrator-client
      usr/share/doc/percona-toolkit/copyright: licenses/COPYRIGHT-percona-toolkit
      usr/share/doc/libdbd-mysql-perl/copyright: licenses/COPYRIGHT-libdbd-mysql-perl
      usr/share/doc/util-linux/copyright: licenses/COPYRIGHT-util-linux
      usr/share/doc/perl/copyright: licenses/COPYRIGHT-perl
      usr/share/doc/libdbi-perl/copyright: licenses/COPYRIGHT-libdbi-perl
      usr/share/doc/libterm-readkey-perl/copyright: licenses/COPYRIGHT-libterm-readkey-perl
      usr/share/doc/libio-socket-ssl-perl/copyright: licenses/COPYRIGHT-libio-socket-ssl-perl
  snap-license:
    plugin: dump
    source: .
    source-type: local
    stage:
      - licenses/LICENSE-snap
    organize:
      LICENSE: licenses/LICENSE-snap
  snap-scripts:
    plugin: dump
    source: snap/local
    source-type: local
    override-prime: |
      craftctl default
      sed -i 's/_NAME_/$SNAPCRAFT_PROJECT_NAME/g' bin/*.sh
      sed -i 's/_NAME_/$SNAPCRAFT_PROJECT_NAME/g' etc/*.cnf
      sed -i 's/_NAME_/$SNAPCRAFT_PROJECT_NAME/g' etc/*.json
